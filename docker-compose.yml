# loomy2api — Docker Compose
#
#   cp .env.example .env && vi .env && chmod 600 .env
#   docker compose up -d --build
#
# Exposes:
#   7865  OpenAI-compatible API  (/v1/*) + admin/monitoring pages
#   6080  noVNC            — remote Chromium for Loomy login
#
# Port 6080 drives a logged-in browser session. Keep it on LAN/VPN only;
# never publish it to the internet.

services:
  loomy2api:
    build: .
    image: loomy2api:latest
    container_name: loomy2api
    restart: unless-stopped

    ports:
      - "7865:7865"   # API + admin UI  — put behind your own auth/reverse proxy if exposed
      - "6080:6080"   # noVNC login console — LAN/VPN only

    env_file: [.env]

    volumes:
      # Sole persistent volume. Holds the conversation DB, one credential file
      # per account, the account registry and the pool runtime state.
      - ./data:/app/data

    environment:
      TZ: Asia/Shanghai
      # Chromium needs a shared-memory area larger than the 64 MB default.
      # Compose sets shm_size via the service key below.

    shm_size: 256m

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7865/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Chromium inside the container is the reason for the relaxed sandbox;
    # it matches the upstream Playwright image defaults.
    security_opt:
      - seccomp:unconfined

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
